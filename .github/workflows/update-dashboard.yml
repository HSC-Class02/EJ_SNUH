name: Update SNUH financial dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'index.html'
      - 'config.yml'
      - 'requirements.txt'
      - 'data/**'
      - 'docs/data.json'
      - 'docs/updated.json'
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snuh-pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect DART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m src.main

      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json docs/updated.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update SNUH DART data"
            git push
          fi

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p docs
          cp index.html docs/index.html
          touch docs/.nojekyll
          if [ ! -s docs/data.json ]; then
            printf '[]\n' > docs/data.json
          fi
          if [ ! -s docs/updated.json ]; then
            printf '{"updated_at":null,"data_source":"OpenDART","status":"pending","message":"DART 자료 수집 결과를 기다리고 있습니다."}\n' > docs/updated.json
          fi
          test -s docs/index.html
          test -s docs/data.json
          test -s docs/updated.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
